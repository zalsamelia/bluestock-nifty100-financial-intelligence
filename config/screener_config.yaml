# Screener Engine Configuration
# Defines filter thresholds, preset screeners, metric column mappings, and scoring weights.

# 1. Preset Screener Template Definitions
presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE, low leverage, positive FCF, and strong 5-year revenue growth."
    filters:
      return_on_equity_pct_min: 15.0
      debt_to_equity_max: 1.0
      free_cash_flow_cr_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    name: "Value Pick"
    description: "Undervalued companies with reasonable P/E, P/B, manageable debt, and dividend yield."
    filters:
      pe_ratio_max: 30.0
      pb_ratio_max: 4.5
      debt_to_equity_max: 2.0
      dividend_yield_pct_min: 0.5

  growth_accelerator:
    name: "Growth Accelerator"
    description: "Fast-growing companies with high profit and revenue CAGR and reasonable debt."
    filters:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      debt_to_equity_max: 2.0

  dividend_champion:
    name: "Dividend Champion"
    description: "High dividend yield, sustainable payout ratio, and positive free cash flow."
    filters:
      dividend_yield_pct_min: 2.0
      dividend_payout_ratio_pct_max: 80.0
      free_cash_flow_cr_min: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero debt or debt-free status, solid ROE, and large revenue scale."
    filters:
      debt_to_equity_max: 0.0
      return_on_equity_pct_min: 12.0
      sales_min: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Improving 3-year revenue growth, positive FCF in latest year, and declining D/E YoY."
    filters:
      revenue_cagr_3yr_min: 10.0
      free_cash_flow_cr_min: 0.0
      de_declining_yoy: true

# 2. Composite Quality Score Weights (0 to 100 Scale)
composite_score_weights:
  profitability:
    total_weight: 0.35
    metrics:
      return_on_equity_pct: 0.15
      roce_pct: 0.10
      net_profit_margin_pct: 0.10
  cash_quality:
    total_weight: 0.30
    metrics:
      fcf_cagr_5yr: 0.15
      cfo_quality_score: 0.10
      fcf_positive_flag: 0.05
  growth:
    total_weight: 0.20
    metrics:
      revenue_cagr_5yr: 0.10
      pat_cagr_5yr: 0.10
  leverage:
    total_weight: 0.15
    metrics:
      debt_to_equity: 0.10  # Inverted (lower D/E = higher score)
      interest_coverage: 0.05

# 3. Column Names & Database Metric Mapping
metric_mappings:
  return_on_equity_pct: "financial_ratios.return_on_equity_pct"
  debt_to_equity: "financial_ratios.debt_to_equity"
  free_cash_flow_cr: "financial_ratios.free_cash_flow_cr"
  revenue_cagr_5yr: "financial_ratios.revenue_cagr_5yr"
  pat_cagr_5yr: "financial_ratios.pat_cagr_5yr"
  operating_profit_margin_pct: "financial_ratios.operating_profit_margin_pct"
  pe_ratio: "market_cap.pe_ratio"
  pb_ratio: "market_cap.pb_ratio"
  dividend_yield_pct: "market_cap.dividend_yield_pct"
  interest_coverage: "financial_ratios.interest_coverage"
  market_cap_crore: "market_cap.market_cap_crore"
  net_profit: "profitandloss.net_profit"
  eps_cagr_5yr: "financial_ratios.eps_cagr_5yr"
  asset_turnover: "financial_ratios.asset_turnover"
  sales: "profitandloss.sales"
